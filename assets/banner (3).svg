<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Ghost Data Auditor - deletion audit agent" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glowA" cx="0.88" cy="0.05" r="0.75"><stop offset="0" stop-color="#4263eb" stop-opacity="0.50"/><stop offset="1" stop-color="#4263eb" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="0.05" cy="1.05" r="0.6"><stop offset="0" stop-color="#7048e8" stop-opacity="0.28"/><stop offset="1" stop-color="#7048e8" stop-opacity="0"/></radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b4c0ff"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8" stop-opacity="0"/><stop offset="0.12" stop-color="#38bdf8"/><stop offset="0.88" stop-color="#38bdf8"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient>
    <radialGradient id="beamGlow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#8da2fb" fill-opacity="0.16"/></pattern>
    <linearGradient id="dotFade" x1="0" y1="0" x2="1" y2="0"><stop offset="0.35" stop-color="#fff" stop-opacity="0"/><stop offset="0.75" stop-color="#fff" stop-opacity="1"/></linearGradient>
    <mask id="dotMask"><rect width="1280" height="400" fill="url(#dotFade)"/></mask>
  </defs>

  <rect width="1280" height="400" fill="#0a0f1c"/>
  <rect width="1280" height="400" fill="url(#glowA)"/>
  <rect width="1280" height="400" fill="url(#glowB)"/>
  <rect width="1280" height="400" fill="url(#dots)" mask="url(#dotMask)"/>
  <rect x="0.5" y="0.5" width="1279" height="399" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>

  <!-- brand + title -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="80" y="62" width="30" height="30" rx="8" fill="url(#brand)"/>
    <path d="M89 78 l5 5 l9 -10" fill="none" stroke="#0a0f1c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="124" y="83" font-size="13.5" font-weight="700" letter-spacing="3" fill="#8fa0c9">DELETION AUDIT AGENT</text>

    <text x="76" y="178" font-size="72" font-weight="800" letter-spacing="-1.8" fill="url(#word)">Ghost Data</text>
    <text x="76" y="254" font-size="72" font-weight="800" letter-spacing="-1.8" fill="url(#word)">Auditor</text>

    <text x="80" y="300" font-size="20" fill="#9fb0d3">Proves whether deleted personal data is really gone,</text>
    <text x="80" y="327" font-size="20" fill="#9fb0d3">across databases, logs, search indexes and backups.</text>

    <g font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#6b7fae" letter-spacing="0.4">
      <text x="80" y="370">IDENTITY</text><text x="152" y="370" fill="#41527f">›</text>
      <text x="170" y="370">EVIDENCE</text><text x="242" y="370" fill="#41527f">›</text>
      <text x="260" y="370">POLICY</text><text x="316" y="370" fill="#41527f">›</text>
      <text x="334" y="370">REMEDIATION</text><text x="428" y="370" fill="#41527f">›</text>
      <text x="446" y="370">VERIFICATION</text>
    </g>
  </g>

  <!-- right: record cards + audit beam -->
  <g transform="translate(700 46)" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace">
    <g>
      <rect width="480" height="52" rx="11" fill="#101830" stroke="#3a55a8"/>
      <circle cx="30" cy="26" r="9" fill="#5b7cfa"/><rect x="54" y="15" width="196" height="8" rx="4" fill="#d3dbfb"/><rect x="54" y="31" width="122" height="6" rx="3" fill="#62759f"/>
      <rect x="360" y="15" width="98" height="22" rx="11" fill="#14532d" fill-opacity="0.5" stroke="#22c55e" stroke-opacity="0.75"/><text x="409" y="30.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#86efac">VERIFIED</text>
    </g>
    <g transform="translate(0 66)">
      <rect width="480" height="52" rx="11" fill="#101830" stroke="#3a55a8"/>
      <circle cx="30" cy="26" r="9" fill="#5b7cfa"/><rect x="54" y="15" width="150" height="8" rx="4" fill="#d3dbfb"/><rect x="54" y="31" width="150" height="6" rx="3" fill="#62759f"/>
      <rect x="338" y="15" width="120" height="22" rx="11" fill="#7f1d1d" fill-opacity="0.5" stroke="#f87171" stroke-opacity="0.85"/><text x="398" y="30.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fca5a5">STILL PRESENT</text>
    </g>
    <g transform="translate(0 132)">
      <rect width="480" height="52" rx="11" fill="#101830" stroke="#3a55a8"/>
      <circle cx="30" cy="26" r="9" fill="#5b7cfa"/><rect x="54" y="15" width="214" height="8" rx="4" fill="#d3dbfb"/><rect x="54" y="31" width="96" height="6" rx="3" fill="#62759f"/>
      <rect x="344" y="15" width="114" height="22" rx="11" fill="#78350f" fill-opacity="0.5" stroke="#fbbf24" stroke-opacity="0.8"/><text x="401" y="30.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fcd34d">ACTIVE SYNC</text>
    </g>

    <!-- audit_at beam -->
    <g transform="translate(0 198)">
      <ellipse cx="240" cy="0" rx="300" ry="26" fill="url(#beamGlow)"/>
      <rect x="-40" y="-1" width="560" height="2" fill="url(#beam)"/>
      <rect x="388" y="-12" width="86" height="24" rx="12" fill="#0a0f1c" stroke="#38bdf8" stroke-opacity="0.9"/>
      <circle cx="404" cy="0" r="3.5" fill="#38bdf8"/><text x="414" y="4.2" font-size="11.5" font-weight="700" fill="#7dd3fc">audit_at</text>
    </g>

    <g transform="translate(0 214)" opacity="0.5">
      <rect width="480" height="52" rx="11" fill="#101830" stroke="#3a55a8" stroke-dasharray="6 5"/>
      <circle cx="30" cy="26" r="9" fill="none" stroke="#5b7cfa" stroke-dasharray="3 3"/><rect x="54" y="15" width="170" height="8" rx="4" fill="#d3dbfb" fill-opacity="0.6"/><rect x="54" y="31" width="110" height="6" rx="3" fill="#62759f"/>
      <rect x="352" y="15" width="106" height="22" rx="11" fill="none" stroke="#a5b4fc" stroke-opacity="0.7"/><text x="405" y="30.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c7d2fe">ANONYMIZED</text>
    </g>
    <g transform="translate(0 280)" opacity="0.26">
      <rect width="480" height="52" rx="11" fill="none" stroke="#3a55a8" stroke-dasharray="3 6"/>
      <circle cx="30" cy="26" r="9" fill="none" stroke="#5b7cfa" stroke-dasharray="2 4"/><rect x="54" y="15" width="140" height="8" rx="4" fill="#d3dbfb" fill-opacity="0.4"/><rect x="54" y="31" width="82" height="6" rx="3" fill="#62759f" fill-opacity="0.6"/>
    </g>
  </g>
</svg>
